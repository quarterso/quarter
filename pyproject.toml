[project]
name = "quarter-ledger"
version = "0.1.7"
description = "Spending caps, approvals and a tamper-evident ledger for what AI agents spend"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Quarter", email = "hello@quarterfi.com" }]
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://quarterfi.com"
Source = "https://github.com/quarterso/quarter"

[project.scripts]
quarter-ledger = "quarter_ledger.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
