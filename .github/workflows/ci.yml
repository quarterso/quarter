name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
      - run: node --test
        working-directory: sellers
      - run: npm ci
        working-directory: x402
      - run: node --test
        working-directory: x402
      - run: node --test
        working-directory: examples/cloudflare-seller
      - run: npm ci
        working-directory: stripe-app
      - run: npm test
        working-directory: stripe-app
      - run: npm run typecheck
        working-directory: stripe-app
